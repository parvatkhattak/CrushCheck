services:
  - type: web
    name: crushcheck-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: ENVIRONMENT
        value: production
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: PYTHON_VERSION
        value: 3.11.9
